<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="shortcut icon" href="{{ "/assets/img/favicon.ico" | relative_url }}" type="image/x-icon">
  <link rel="stylesheet" type="text/css" href="{{ "/assets/css/style.css" | relative_url }}">
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <link rel="preload" as="font" href="https://fonts.googleapis.com/css?family=Roboto:300,300i,400,400i,700,700i" crossorigin>
  {% seo %}
</head>
<body{% if page.id %} id="{{ page.id }}"{% endif %} class="{{ page.layout }}">

  <div class="page-header pt-4">
    <div class="container-xl p-responsive">
      <div class="text-center">
        <div class="logo-stage">
          <a href="{{ "/fr/" | relative_url}}" class="logo-link"><img class="logo" src="{{ "/assets/img/logo_white.png" | relative_url}}" alt="OSFarm"></a>
        </div>
        {% include orbit-data.html %}
        <script type="module" src="{{ "/assets/js/header-banner.js" | relative_url }}"></script>
      </div>
    </div>

    <nav class="site-nav" aria-label="Navigation principale">
      <div class="site-nav-inner container-xl p-responsive">
        <ul class="site-nav-links">
          <li><a href="{{ "/fr/why/" | relative_url}}"{% if page.url == "/fr/why/" %} aria-current="page"{% endif %}>Pourquoi</a></li>
          <li><a href="{{ "/fr/communs/" | relative_url}}"{% if page.url == "/fr/communs/" %} aria-current="page"{% endif %}>Communs</a></li>
          <li><a href="{{ "/fr/actualites/" | relative_url}}"{% if page.url == "/fr/actualites/" %} aria-current="page"{% endif %}>Actualités</a></li>
          <li><a href="{{ "/fr/catalogue/" | relative_url}}"{% if page.url == "/fr/catalogue/" %} aria-current="page"{% endif %}>Formation</a></li>
          <li><a href="{{ "/fr/#contact-a-human" | relative_url}}">Contact</a></li>
        </ul>
        <div class="site-nav-actions">
          <p class="site-nav-lang" aria-label="Langue du site">
            <span aria-current="true">FR</span><a href="{{ site.baseurl }}/" lang="en" hreflang="en">EN</a>
          </p>
          <a class="site-join" href="https://www.helloasso.com/associations/osfarm/adhesions/adhesion-osfarm-2024" target="_blank" rel="noopener">Adhérer</a>
        </div>
      </div>
    </nav>
    <!-- .full-width here gets closed on support-page.html and home.html layouts -->
