# global settings
title: "OSFarm"
description: "Building together a new innovative ecosystem for farms"
permalink: pretty
# Public address: osfarm.org and osfarm.github.io both redirect here (301).
# Canonical links, the sitemap and robots.txt are built from it.
url: https://www.osfarm.org
baseurl: ""
relative_permalinks: false

# Search engines and social cards (jekyll-seo-tag, see _includes/header.html)
logo: /assets/img/osfarm-logo-carre.png
social:
  name: OSFarm
  links:
    - https://github.com/osfarm
    - https://www.linkedin.com/company/osfarm
twitter:
  card: summary_large_image
# Google Analytics 4 measurement ID (G-XXXXXXXXXX). Loaded only in production
# builds, and only once set.
google_analytics: G-832L2YLP8Z
# Google Search Console: prefer a "Domain" property verified by a DNS TXT record
# on osfarm.org. If an HTML tag is used instead, set its content here:
# webmaster_verifications:
#  google: ""

defaults:
  - scope:
      path: ""
    values:
      lang: en
      image: /assets/img/osfarm-partage.jpg
  - scope:
      path: "fr"
    values:
      lang: fr

# build settings
exclude: ["script", "spec", "vendor", "CLAUDE.md", "Gemfile", "Gemfile.lock", "Rakefile", "readme.md", "package.json", "package-lock.json", "node_modules"]
markdown: kramdown
plugins:
  - jekyll-avatar
  - jekyll-polyglot
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-coffeescript
  - jekyll-sitemap
  - jekyll-octicons
  - jekyll-youtube

sass:
  style: :compressed
  # Where you keep your scss files
  sass_dir: assets/css/
  # Where sass should look for other scss
  load_paths:
    - node_modules/
  sourcemap: never

lsi: false
safe: true
incremental: false
highlighter: rouge
gist:
  noscript: false
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

unexisting_page:
  en: "The page you're looking for doesn't seem to be there!"
  fr: "La page demandée n'est pas présente ici !"
