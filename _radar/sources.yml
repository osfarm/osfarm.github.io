# Radar OSFarm — sources surveillées
# Ajouter une source = ajouter un bloc. Rien d'autre à modifier.
#
# type       github_search | huggingface | datagouv | zenodo | oshwa | rss | api | liste
# famille    logiciel | materiel | donnees | modele
# relecteur  identifiant GitHub de la personne qui valide cette famille, ou une
#            liste d'identifiants ; mentionnés dans la pull request du jour
# actif      false pour désactiver sans supprimer
# famille_fixe  true pour que le modèle de langue ne reclasse pas les fiches
#               de cette source (utile au matériel, souvent vu comme du logiciel)

reglages:
  seuil_score: 55          # en dessous, mise en quarantaine
  max_par_relecteur: 8     # plafond par lot : la relecture doit tenir en 3 min
  quarantaine_jours: 90    # délai avant de réexaminer un projet écarté
  pause_entre_sources: 1
  bonus_curation: 10       # points d'une entrée retenue par une liste de la communauté

sources:

  # ---------------------------------------------------------------- logiciels
  # La recherche GitHub n'accepte pas de OR entre qualificateurs : une requête
  # par ligne. etoiles_min est le filtre le plus efficace contre les dépôts vides.
  - id: github-agri
    famille: logiciel
    type: github_search
    requetes:
      - topic:agriculture
      - topic:agritech
      - topic:precision-agriculture
      - topic:agroecology
    filtres: { pousse_depuis: 180j, etoiles_min: 3 }
    limite: 30
    relecteur: alaabenfatma

  - id: github-elevage
    famille: logiciel
    type: github_search
    requetes:
      - topic:livestock
      - topic:dairy
      - topic:beekeeping
      - topic:aquaculture
    filtres: { pousse_depuis: 365j, etoiles_min: 3 }
    limite: 20
    relecteur: ionosphere

  - id: github-viti
    famille: logiciel
    type: github_search
    requetes:
      - "viticulture in:name,description,topics"
      - "vineyard in:name,description,topics"
      # pas de requête « orchard » : elle ramène surtout OrchardCMS et homonymes
    filtres: { pousse_depuis: 365j, etoiles_min: 3 }
    limite: 20
    relecteur: ionosphere

  - id: joss
    famille: logiciel
    type: rss
    url: https://joss.theoj.org/papers/published.atom
    filtres: { licence_par_defaut: osi-approuvee }   # JOSS exige une licence OSI
    limite: 40
    relecteur: alaabenfatma

  # ----------------------------------------------------------------- matériel
  - id: oshwa
    famille: materiel
    famille_fixe: true
    type: oshwa
    url: https://certificationapi.oshwa.org/api/projects
    filtres:
      mots_cles: [farm, agri, soil, crop, livestock, garden, irrigation, greenhouse, bee]
    limite: 200
    relecteur: jancelin
    # nécessite OSHWA_TOKEN ; sans jeton la source est simplement ignorée

  - id: github-materiel-agri
    famille: materiel
    famille_fixe: true
    type: github_search
    requetes:
      - "topic:open-hardware agriculture"
      - topic:farmbot
      - topic:agopengps
    filtres: { pousse_depuis: 540j, etoiles_min: 3 }
    limite: 20
    relecteur: jancelin

  # ------------------------------------------------------------------ données
  - id: datagouv-agriculture
    famille: donnees
    type: datagouv
    url: https://www.data.gouv.fr/api/1/datasets/?tag=agriculture&sort=-created
    limite: 40
    relecteur: bertrandgorge

  - id: datagouv-agroalimentaire
    famille: donnees
    type: datagouv
    url: https://www.data.gouv.fr/api/1/datasets/?tag=agroalimentaire&sort=-created
    limite: 20
    relecteur: bertrandgorge

  - id: zenodo-agri
    famille: donnees
    type: zenodo
    url: https://zenodo.org/api/records?q=agriculture%20AND%20access_right:open&type=dataset
    limite: 25     # maximum accepté par Zenodo sans authentification
    relecteur: bertrandgorge

  - id: europa-agri
    famille: donnees
    type: api
    url: https://data.europa.eu/api/hub/search/search
    parametres: { q: agriculture, limit: 30, sort: "modified+desc" }
    liste: result.results
    champs:
      titre: title.fr
      url: resource
      description: description.fr
      licence: distributions.0.license.resource
      date: modified
    relecteur: bertrandgorge
    actif: false   # activer après vérification du format de réponse

  - id: hf-datasets-agri
    famille: donnees
    type: huggingface
    url: https://huggingface.co/api/datasets?search=crop
    limite: 30
    relecteur: ionosphere

  # ------------------------------------------------------------ modèles et IA
  - id: hf-modeles-agri
    famille: modele
    type: huggingface
    url: https://huggingface.co/api/models?search=agriculture
    limite: 40
    relecteur: ionosphere

  - id: hf-modeles-plantes
    famille: modele
    type: huggingface
    url: https://huggingface.co/api/models?search=plant%20disease
    limite: 30
    relecteur: ionosphere

  # Flux sans information de licence : toutes leurs entrées seraient écartées.
  # À n'activer qu'avec un licence_par_defaut vérifié pour la source.
  - id: hackaday-agri
    famille: materiel
    type: rss
    url: https://hackaday.com/tag/agriculture/feed/
    limite: 20
    relecteur: ""
    actif: false

  # ------------------------------------------------ listes de la communauté
  # Des listes « awesome » tenues à la main par d'autres. Une liste s'importe
  # une fois (Actions → Radar des communs → Run workflow, champ « liste »),
  # puis seules ses nouveautés remontent. Tant que l'import n'est pas fusionné,
  # la collecte quotidienne l'ignore. Conception : _radar/LISTES.md
  #   url                   README brut de la liste
  #   nom                   écrit dans le champ `curation` des fiches
  #   familles_par_section  morceau d'un titre de section → famille, du titre
  #                         le plus proche au plus lointain ; sinon `famille`
  #   suivre_les_sites      false pour ne pas lire les sites vitrines à la
  #                         recherche de leur dépôt
  #   sections_ignorees     titres exacts des sections à laisser de côté : une
  #                         licence ouverte et un dépôt actif suffisent à passer
  #                         le seuil, un outil générique aussi (Grafana, InfluxDB…)
  - id: liste-osa
    type: liste
    url: https://raw.githubusercontent.com/geezacoleman/OpenSourceAgriculture/main/README.md
    nom: OpenSourceAgriculture
    famille: logiciel
    familles_par_section:
      dataset: donnees
      foundation model: modele
      hardware: materiel
      in-field: materiel
    famille_fixe: true
    relecteur: [ionosphere, bertrandgorge]

  - id: liste-awesome-agriculture
    type: liste
    url: https://raw.githubusercontent.com/brycejohnston/awesome-agriculture/master/README.md
    nom: awesome-agriculture
    famille: logiciel
    familles_par_section:
      datasets: donnees
      hardware: materiel
      robotics: materiel
    relecteur: [ionosphere, bertrandgorge]

  # Récente et active, orientée culture sous abri et domotique. Calibrée le
  # 26/09/2026 : sans ses sections d'outils génériques (bases de séries
  # temporelles, visualisation, domotique, protocoles), elle proposait Grafana,
  # InfluxDB ou Node-RED avec des notes de 85 et plus.
  - id: liste-cropsteering
    type: liste
    url: https://raw.githubusercontent.com/Intergalactic-XYZ/awesome-cropsteering/main/README.md
    nom: awesome-cropsteering
    famille: logiciel
    familles_par_section:
      diy: materiel
      components: materiel
      sensors: materiel
      mcu: materiel
      relay: materiel
      mixers: materiel
    sections_ignorees:
      - Node RED
      - Home Assistant
      - Home Assistant UI
      - ESPHome
      - Tasmota
      - MCU and SOC
      - MQTT
      - Storing Data
      - Visualization Libraries
      - Visualization platforms
      - Zigbee
      - Crop Steering Guides
    relecteur: [ionosphere, bertrandgorge]
