# ---------------------------------------------------------------------------
# OSFarm — Catalogue formation & conseil
# Source unique de vérité : les pages /fr/catalogue/ et /catalogue/, le flux
# /catalogue.json et les formulaires se régénèrent au build GitHub Pages.
#
# Modèle : l'association référence, les adhérents opèrent.
# Aucune commission. Être adhérent est la seule condition de référencement.
#
# Les opérateurs sont décrits dans _data/operateurs.yml ; un module n'affiche
# le bouton « demander un devis » que si `statut: ouvert` ET `operateur`
# renseigné. Les modules et les missions sont classés par référence.
# ---------------------------------------------------------------------------

meta:
  remise_adherent_min: 20      # % de remise minimum imposée par la charte
  delai_reponse_jours: 5       # engagement de réponse de l'opérateur
  commission: 0                # service gratuit — ne pas modifier sans vote du bureau
  devise: EUR
  # Adresses lues par assets/js/catalogue.js : rien n'est codé en dur côté JS.
  courriel_repli: "contact@osfarm.org"
  adhesion_url: "https://www.helloasso.com/associations/osfarm/adhesions/adhesion-osfarm-2024"
  webhook_demande: "https://automation.osfarm.org/webhook/catalogue-demande"
  webhook_candidature: "https://automation.osfarm.org/webhook/catalogue-operateur"

# Couleurs alignées sur les familles de l'annuaire des communs (/fr/communs/) :
# données en bleu, modèles en violet, matériels en ocre, logiciels en vert.
familles:
  - id: A
    couleur: "#2c6590"
    titre:
      fr: "Données et interopérabilité"
      en: "Data and interoperability"
  - id: B
    couleur: "#5b4a8b"
    titre:
      fr: "Intelligence artificielle ouverte et frugale"
      en: "Open and frugal artificial intelligence"
  - id: C
    couleur: "#6e5600"
    titre:
      fr: "Machinisme, robotique et capteurs ouverts"
      en: "Open machinery, robotics and sensors"
  - id: D
    couleur: "#338000"
    titre:
      fr: "Gestion, connaissance et évaluation"
      en: "Management, knowledge and assessment"

# statut : "ouvert" (opérateur signataire) | "a_pourvoir" (appel à opérateur)
modules:

  - ref: A1
    famille: A
    statut: ouvert
    duree_jours: 1
    tarif_public: 1200
    operateur: brad
    secours: [ekylibre]
    outils: [lexicon]
    titre:
      fr: "Exploiter les données agricoles ouvertes avec l'API Lexicon"
      en: "Using open agricultural data through the Lexicon API"
    resume:
      fr: "Plus de cent sources normalisées derrière une seule API : parcellaire, météo, phytosanitaire, référentiels variétaux. Le participant repart avec une intégration fonctionnelle dans son propre outil."
      en: "More than a hundred standardised sources behind a single API. Participants leave with a working integration in their own tool."
    public:
      fr: "Développeurs, DSI de coopératives et d'organismes agricoles, éditeurs."
      en: "Developers, IT departments of cooperatives and farm organisations, software vendors."

  - ref: A2
    famille: A
    statut: ouvert
    duree_jours: 0.5
    tarif_public: 700
    operateur: ekylibre
    secours: []
    outils: [normes]
    titre:
      fr: "Normes et interopérabilité agricole : ISOBUS, ADAPT, AgGateway, AgroXML"
      en: "Agricultural standards and interoperability: ISOBUS, ADAPT, AgGateway, AgroXML"
    resume:
      fr: "Savoir quelle norme s'applique à quel flux et arbitrer entre adopter un standard, l'étendre ou passer par une passerelle. Sortie de séance : la cartographie des flux de l'organisation."
      en: "Know which standard applies to which data flow, and choose between adopting, extending or bridging. Output: a map of the organisation's data flows."
    public:
      fr: "Chefs de produit, responsables innovation, acheteurs de solutions."
      en: "Product managers, innovation leads, solution buyers."

  - ref: A3
    famille: A
    statut: ouvert
