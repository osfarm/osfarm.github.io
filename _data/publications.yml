# Rubrique Documentation : /fr/documentation/ et /documentation/
# (_includes/documentation.html), plus le socle du chatbot (data/socle.txt).
# Cadrage : _documentation/EXIGENCES.md.
#
# Des lectures, pas des communs : rien ici n'entre dans l'annuaire, son
# compteur ou /data/communs.json. Ajouter une entrée à `publications` suffit à
# la publier sur les deux pages et à la rendre citable par l'assistant.
#
# Une entrée :
#   id          stable, sert d'ancre #pub-<id> ; ne jamais le changer
#   titre       dans la langue du document, jamais traduit
#   auteur      auteurs ou organisme, sous le nom qu'ils portent sur le document
#               (non traduit : la page anglaise le montre aussi)
#   annee       année du DOCUMENT, pas de sa page web ; `continu` pour un portail
#   nature      un `id` de `natures`
#   groupe      un `id` de `groupes`
#   langue      langue du texte : fr ou en
#   resume      { fr, en } — rédigé par l'association, jamais copié de l'éditeur
#   url         lien pérenne, DOI quand il existe
#   acces       ouvert (texte librement lisible), formulaire (gratuit contre un
#               formulaire) ou notice (présentation seule, texte ailleurs ou payant)
#   verifie_le  date du dernier contrôle du lien
#   pourquoi    true pour les sources citées sur /why/ et /fr/why/
#   titre_fr, url_fr   facultatifs : la version française officielle, montrée
#               sur la page française à la place de l'originale
#
# Entrées rangées par groupe, puis par titre.
groupes:
  - id: france
    titre: { fr: Références françaises et recherche appliquée, en: French references and applied research }
  - id: europe
    titre: { fr: Études et politiques européennes, en: European studies and policies }
  - id: etats-unis
    titre: { fr: Instituts et universités des États-Unis, en: United States institutes and universities }
  - id: international
    titre: { fr: Organisations internationales, en: International organisations }
  - id: recherche
    titre: { fr: Recherche ouverte et évaluation des modèles, en: Open research and model evaluation }
  - id: portails
    titre: { fr: Portails et ressources vivantes, en: Portals and living resources }
# `avertissement` s'affiche sur la carte : le lecteur doit savoir ce qu'il lit.
natures:
  - id: rapport
    titre: { fr: Rapport, en: Report }
  - id: etude
    titre: { fr: Étude, en: Study }
  - id: strategie
    titre: { fr: Stratégie publique, en: Public strategy }
  - id: ouvrage
    titre: { fr: Ouvrage, en: Book }
  - id: dossier
    titre: { fr: Dossier, en: Feature }
  - id: article
    titre: { fr: Article évalué, en: Peer-reviewed paper }
  - id: prepublication
    titre: { fr: Prépublication, en: Preprint }
    avertissement:
      fr: Prépublication arXiv — la version liée n'est pas celle d'une revue ; à lire comme un travail en cours.
      en: arXiv preprint — the linked version is not a journal version; read it as work in progress.
  - id: portail
    titre: { fr: Portail, en: Portal }
    avertissement:
      fr: Portail vivant — source de veille, non publication.
      en: Living portal — a watch source, not a publication.
