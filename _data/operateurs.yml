# ---------------------------------------------------------------------------
# OSFarm — Opérateurs du catalogue formation & conseil (_data/catalogue.yml)
#
# Ce qui s'affiche sur le site dépend du module, pas de cette liste : un module
# propose un devis dès que son `statut` est `ouvert` et son `operateur`
# renseigné. C'est au responsable catalogue de n'ouvrir un module qu'une fois
# la charte signée par l'opérateur — `adherent`, `charte_signee` et `qualiopi`
# sont la trace de ce contrôle, `qualiopi: true` s'affichant sur la fiche.
#
# Champs à compléter par le responsable catalogue : `url`, `qualiopi`, et
# `charte_signee` (date AAAA-MM-JJ) au fur et à mesure des signatures.
# Les entrées `role: partenaire` sont citées sur les fiches sans être
# destinataires des demandes.
# ---------------------------------------------------------------------------

