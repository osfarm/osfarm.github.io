# Projets choisis par la communauté OSFarm, affichés dans l'annuaire des communs
# (/fr/communs/), sur la page /community/ et sur les pages d'accueil.
# Ce fichier se tient à la main ; les autres fichiers de ce dossier sont les lots
# du radar. Pour ajouter un projet, copier une fiche et l'adapter :
#   titre, url        nom et site du projet
#   depot             dépôt de code, s'il diffère de l'url
#   demo, img         lien de démonstration, logo dans /assets/img/projects/
#   img_fond          « sombre » pour un logo blanc, posé alors sur fond foncé
#   github_org        compte GitHub, pour l'avatar des pages d'accueil
#   famille           logiciel | materiel | donnees | modele
#   categorie         catégorie en français (annuaire) ; category : en anglais (/community/)
#   licence, techno   identifiant SPDX en minuscules ; langage principal du dépôt
#   description       texte d'origine publié par le projet
#   resume, interet   deux phrases en français ; une phrase « Permet de… »
#   mots_cles_fr      trois à cinq mots-clés en minuscules
#   date_maj          dernière activité du dépôt ; propose_le : date d'ajout
# Le radar ne repropose pas un projet dont l'url ou le dépôt figure ici.
#
# `meta` et `familles` servent au formulaire « proposer un projet » de
# /fr/communs/ et /community/ (_includes/communs-proposition.html) : la
# proposition part sur le webhook, le workflow n8n « Annuaire — proposition de
# projet » écarte les doublons, complète la fiche depuis la forge et ouvre la
# pull request qui l'ajoute à `candidats`. Déplacer le webhook ici suffit :
# rien n'est codé en dur dans assets/js/communs-proposition.js.
titre: Projets de la communauté OSFarm
meta:
  webhook_proposition: "https://automation.osfarm.org/webhook/communs-proposition"
  courriel_repli: "contact@osfarm.org"
familles:
  - id: logiciel
    titre: { fr: Logiciel, en: Software }
  - id: materiel
    titre: { fr: Matériel, en: Hardware }
  - id: donnees
    titre: { fr: Données, en: Data }
  - id: modele
    titre: { fr: Modèle, en: Model }
# `familles` répond à « quelle sorte d'artefact ? », `types` à « quel rôle dans
# l'écosystème ? ». Les deux axes se lisent ensemble : FarmBot est un `materiel`
# de type `ecosysteme` ; ISOBUS est un `donnees` de type `standard`.
#
# `type` est facultatif et vaut `projet` par défaut : le radar n'en émet pas,
# et aucune fiche existante n'a besoin d'être modifiée. Un `composant` doit
# porter `partie_de`, l'identifiant d'une autre fiche de cet annuaire ; c'est le
# composant qui désigne son parent, jamais l'inverse, pour qu'il n'y ait jamais
# deux écritures à tenir d'accord. Voir _annuaire/DESIGN.md.
types:
  - id: projet
    defaut: true
    titre: { fr: Projet, en: Project }
  - id: ecosysteme
    titre: { fr: Écosystème, en: Ecosystem }
  - id: composant
    titre: { fr: Composant, en: Component }
  - id: standard
    titre: { fr: Standard, en: Standard }
  - id: service
    titre: { fr: Service, en: Service }
  - id: besoin
    # Hors du filtre de l'annuaire : les besoins ont leur propre section, et
    # ne sont pas des communs. Les compter avec eux ferait mentir l'indicateur.
    hors_annuaire: true
    titre: { fr: Besoin non couvert, en: Unmet need }
# Les catégories des fiches ci-dessous, proposées telles quelles dans le
# formulaire : `fr` alimente `categorie` (annuaire), `en` alimente `category`
# (/community/, qui groupe par catégorie). Ajouter une catégorie ici avant de
# l'employer dans une fiche, pour ne pas ouvrir un groupe d'un seul projet.
categories:
  - fr: Robotique et automatisation
    en: Automation and Robotics
  - fr: Gestion d'exploitation
    en: Farm Management Systems and Record Keeping
  - fr: Données ouvertes et interopérabilité
    en: Data Standardization, Open Data, Interoperability and APIs
  - fr: Cartographie et SIG
    en: Geospatial, GIS and Global Positionning System reference
  - fr: Capteurs sol et irrigation
    en: IoT, Sensors for soil and irrigation
  - fr: Capteurs et supervision
    en: IoT, Sensors for tracking, isobus and supervising
  - fr: Climat, imagerie et météo
    en: Climate, Environment, Imagery and Weather
  - fr: IA et apprentissage automatique
    en: Machine Learning and AI
  - fr: Équipements et outils
    en: Equipments and Tools
  - fr: Vente et relation client
    en: Sales and Customers links
  - fr: Bases de connaissances
    en: Knowledgebases and Learning Resources
