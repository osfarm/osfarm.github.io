name: Radar des communs

# Chaque jour ouvré : collecte, résumé, puis une pull request « lot du radar ».
# La fusion de cette pull request publie les fiches validées (le site lit
# _data/radar/ directement). Voir _radar/README.md.

on:
  schedule:
    - cron: "0 5 * * 1-5"      # du lundi au vendredi, 5 h UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: radar

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Un seul lot en relecture à la fois : un lot ouvert pendant que le suivant
      # se prépare reproposerait les mêmes projets et ferait entrer les deux
      # pull requests en conflit sur la mémoire. Un lot non fusionné sous trois
      # jours est fermé ; ses projets reviendront dans un lot suivant.
      - name: Fermer les lots expirés
        id: attente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create radar --color 2c974b --description "Lot du radar des communs" --force
          limite=$(date -u -d '3 days ago' +%FT%TZ)
          gh pr list --label radar --state open --json number,createdAt \
            -q ".[] | select(.createdAt < \"$limite\") | .number" |
          while read -r n; do
            gh pr close "$n" --delete-branch \
              --comment "Lot expiré faute de fusion sous trois jours. Ses projets reviendront dans un prochain lot."
          done
          ouverts=$(gh pr list --label radar --state open --json number -q 'length')
          echo "ouverts=$ouverts" >> "$GITHUB_OUTPUT"
          if [ "$ouverts" != "0" ]; then
            echo "Un lot attend encore sa relecture : pas de nouvelle collecte aujourd'hui."
          fi

      - uses: actions/setup-python@v5
        if: steps.attente.outputs.ouverts == '0'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: _radar/requirements.txt

      - if: steps.attente.outputs.ouverts == '0'
        run: pip install -r _radar/requirements.txt

      - name: Collecte
        id: collecte
        if: steps.attente.outputs.ouverts == '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OSHWA_TOKEN: ${{ secrets.OSHWA_TOKEN }}
        run: python _radar/collecte.py

      - name: Résumé
        if: steps.collecte.outputs.retenus != '' && steps.collecte.outputs.retenus != '0'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python _radar/resume.py --fichier "${{ steps.collecte.outputs.fichier }}"

      - name: Ouvrir la pull request du lot
        if: steps.collecte.outputs.retenus != '' && steps.collecte.outputs.retenus != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: radar/lot-${{ github.run_number }}
          delete-branch: true
          add-paths: |
            _data/radar/*.yml
            _radar/memoire.json
            _radar/resumes.json
          commit-message: "radar : lot à relire (${{ steps.collecte.outputs.retenus }} fiches)"
          title: "Radar : ${{ steps.collecte.outputs.retenus }} fiche(s) à relire"
          body-path: _radar/pr_body.md
          labels: radar

      - name: Signaler les sources en panne
        if: steps.collecte.outputs.pannes != '' && steps.collecte.outputs.pannes != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          titre="Sources du radar en panne"
          corps="Le radar du $(date +%F) signale ${{ steps.collecte.outputs.pannes }} source(s) en échec. Détail dans le journal de l'étape Collecte : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          numero=$(gh issue list --state open --label radar --search "\"$titre\" in:title" --json number -q '.[0].number')
          if [ -z "$numero" ]; then
            gh issue create --title "$titre" --body "$corps" --label radar
          else
            gh issue comment "$numero" --body "$corps"
          fi
